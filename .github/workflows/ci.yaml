name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job here only reads the checkout. Nothing writes a comment, a package or a
# check, so no job raises this.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A statically linked binary is the point of the distroless image, so this is the
# default. The two test jobs override it, because -race requires cgo.
env:
  CGO_ENABLED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # golangci-lint type-checks, so it needs the whole module graph on disk. Left
      # to the linter's own lazy fetches a single flaky proxy read surfaces as a
      # bogus `typecheck` finding on our source, which is indistinguishable from a
      # real one.
      - name: go mod download
        run: go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - name: Import boundaries (credential model, compiled)
        run: go test ./internal/archcheck/...

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        env:
          CGO_ENABLED: "1" # -race requires cgo
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags '-s -w' -o "/tmp/agent-manager-$GOOS-$GOARCH" ./cmd/agent-manager
      - name: Smoke the built binary
        if: matrix.goarch == 'amd64'
        run: /tmp/agent-manager-linux-amd64 version

  generated:
    name: Generated output is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Runs every generator, not just templ: internal/store/schema/02-tables.sql is
      # emitted from the Bun models, so a templ-only check cannot see model drift.
      - name: Regenerate and fail on a diff
        run: task gen:check

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The breaking-change gate compares the contract against the PR's merge base,
          # which is not in a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # spectral and redocly are npm-only and have no Go equivalent. Node here is not the
      # "No Node.js in any image" the constitution forbids: that governs the shipped
      # container, which has none and gets its CSS from the Tailwind standalone binary.
      # Nothing in this job reaches an image or a run-time process.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # vacuum and wiretap are ~110MB of release tarball and openapi-changes is a Go
      # build, so the tools are cached. The key includes Taskfile.openapi.yaml because the
      # install tasks are guarded on existence, not on version — without the hash a
      # version bump would keep restoring the old binary.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: openapi-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Taskfile.openapi.yaml') }}
      - name: Install the contract tooling
        run: task openapi:tools
      - name: Lint the contract (vacuum, spectral, redocly)
        run: task openapi:lint
      - name: Publish the vacuum quality score
        if: always()
        run: task --silent openapi:score >> "$GITHUB_STEP_SUMMARY"
      - name: Build the Redoc docs and the vacuum quality report
        if: always()
        run: |
          task openapi:docs
          task openapi:report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: openapi-docs
          path: |
            docs/api/index.html
            docs/api/quality.html
          if-no-files-found: error
      # Last, so a breaking change does not cost the docs and the score above. The CLI
      # ships separately and cannot be redeployed in step with the hub, so an incompatible
      # change to contracts/openapi.yaml has to fail the build rather than land quietly.
      - name: Breaking-change gate against the merge base
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          if [ -n "${BASE_REF:-}" ]; then
            base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            base=HEAD~1
          else
            echo "no earlier revision of the contract to compare against"
            exit 0
          fi
          echo "comparing the contract against ${base}"
          task openapi:breaking BASE="${base}"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # The per-role grants and every load-bearing constraint are asserted against a
      # real Postgres via testcontainers. The unit suite cannot reach them, so without
      # this job the credential boundary is unverified.
      - name: go test -tags=integration
        env:
          CGO_ENABLED: "1" # -race requires cgo
        run: go test -race -tags=integration -timeout=20m ./...

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -show verbose ./...

  image:
    name: Image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: agent-manager:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs and reports its version
        run: docker run --rm agent-manager:ci version

  # --- the CLI module (cli/) ------------------------------------------------
  #
  # amctl is a second Go module, so every job below points its own toolchain at
  # cli/go.mod. The hub's jobs above are untouched: a nested module is excluded
  # from the root's `./...` pattern, so `go build ./...` and `go test ./...` at
  # the repository root still mean exactly the hub.

  cli-lint:
    name: CLI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
          cache: true
      # Same reason as the hub's lint job: golangci-lint type-checks, so a lazy
      # module fetch that flakes shows up as a bogus `typecheck` finding on our
      # own source.
      - name: go mod download
        run: go mod download
        working-directory: cli
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: cli

  # Both supported operating systems, not one, and that is load-bearing rather than
  # thorough: T009's TestCompiledInBackendSetIsTheOneThisPlatformShouldHave only
  # sees the darwin cgo regression when it runs ON darwin. A linux-only leg makes
  # it a gate that can never fire for the case it was written for, and R1's darwin
  # conclusion stays a deduction from `go list -json` until a mac executes it.
  cli-test:
    name: CLI unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's filesystem semantics failing must not cancel the evidence
      # from the other; that is the whole reason this job is a matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
          cache: true
      - name: go test -race
        working-directory: cli
        env:
          CGO_ENABLED: "1" # -race requires cgo
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      # Ubuntu only. Both legs uploading `cli-coverage` collide on the artifact
      # name, and coverage is a property of the suite rather than of a platform.
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        working-directory: cli
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: cli-coverage
          path: cli/coverage.out
          if-no-files-found: ignore

  cli-build:
    name: CLI build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # The four platforms plan.md's Technical Context names, and no others.
        # Every one is built on a runner of its own architecture so the binary
        # can actually be executed afterwards — a cross-compiled binary that
        # links but cannot start is the failure this matrix exists to catch.
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            cgo: "0"
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            cgo: "0"
          # CGO_ENABLED=1 on darwin, per plan.md R1, which is now MEASURED
          # (T008) and confirmed these values. keyring's keychain.go is the only
          # file in the module gated on cgo (`//go:build darwin && cgo`), and a
          # static darwin build does not contain it — keyring then walks its own
          # backendOrder to the next thing that opens, which is `pass`, not the
          # file. So a Mac developer with pass installed would silently get their
          # token written into a GPG password store. That is worse than the
          # fallback plan.md originally described, and it is exactly the silent
          # downgrade FR-003 forbids.
          #
          # Linux is CGO-invariant (secret-service, kwallet and keyctl are all
          # pure Go), also measured — so only the two mac legs pay for cgo. Note
          # the mac artefacts are therefore NOT static:
          # they link libSystem and Security.framework, which makes the runner's
          # deployment target the minimum supported macOS version.
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            cgo: "1"
          - goos: darwin
            goarch: amd64
            # macos-15-intel, not macos-latest: R1's conclusion is a native
            # macOS build per architecture, and cgo cross-compilation between
            # the two Mac architectures is the thing it rules out.
            runner: macos-15-intel
            cgo: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
          cache: true
      - name: go build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          VERSION: ci-${{ github.sha }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          out="amctl-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/WindKube/agent-manager/cli/internal/cmd.Version=${VERSION} \
              -X github.com/WindKube/agent-manager/cli/internal/cmd.Commit=${COMMIT}" \
            -o "$out" .
          echo "AMCTL_BIN=$out" >> "$GITHUB_ENV"
      # The version string comes from -ldflags -X, so this also proves the stamp
      # path still matches the variables in internal/cmd. A renamed package
      # leaves the flag silently ineffective and the binary reporting "dev".
      - name: The built binary runs and reports its stamped version
        working-directory: cli
        env:
          EXPECTED: ci-${{ github.sha }}
        run: |
          set -eu
          "./$AMCTL_BIN" version
          "./$AMCTL_BIN" version | grep -F "$EXPECTED"
