name: Release amctl

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    # macOS because darwin needs CGO_ENABLED=1 for the keychain backend and
    # cannot be cgo-cross-compiled from linux. See cli/.goreleaser.yaml.
    runs-on: macos-latest
    permissions:
      contents: write # add the archives to the tag's release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: cli/go.mod
          cache: false

      # The one place the suite runs on a Mac, which is the only place plan.md
      # R1's lost-keychain guard can fire.
      - name: Unit tests, on darwin
        working-directory: cli
        run: go test ./...

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.1
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
