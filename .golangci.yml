version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usetesting
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: package-comments
          disabled: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - whyNoLint
        - importShadow
        - hugeParam

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests deliberately construct hostile input and ignore errors while doing it.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
          - noctx
      # Generated code is not ours to lint.
      - path: (_templ\.go|/apiclient/|/migrations/)
        linters:
          - revive
          - gocritic
          - unparam
          - errcheck
          - gosec
          - unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - agent-manager
