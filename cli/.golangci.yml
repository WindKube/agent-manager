# The hub's ruleset (../.golangci.yml), with three deliberate differences: the
# local import prefix is this module's, the generated-code exclusion names this
# module's generated client, and forbidigo forbids os.Exit outside main.go.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usetesting
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
    forbidigo:
      # FR-036's exit codes only mean something if one function owns the
      # mapping. internal/cmd.ExitCode is that function and main.go is the only
      # caller allowed to turn its result into a process status; a bare
      # os.Exit(1) anywhere else silently invents a fifth outcome.
      forbid:
        - pattern: ^os\.Exit$
          msg: return an error and let internal/cmd.ExitCode decide; only main.go may call os.Exit
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: package-comments
          disabled: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - whyNoLint
        - importShadow
        - hugeParam

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests deliberately construct hostile input and ignore errors while doing it.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
          - noctx
      # main.go is the one permitted os.Exit; see the forbidigo note above.
      - path: ^main\.go$
        linters:
          - forbidigo
      # The generated hub client is not ours to lint.
      - path: client\.gen\.go
        linters:
          - revive
          - gocritic
          - unparam
          - errcheck
          - gosec
          - unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/WindKube/agent-manager/cli
