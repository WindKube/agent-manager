# Run from this directory: the CLI is a second Go module, so goreleaser must not
# see the hub's. Driven by the repo's `vX.Y.Z` tags.
#
# The per-platform CGO_ENABLED is measured, not preference (plan.md R1):
# 99designs/keyring's keychain backend is `darwin && cgo`, so a static darwin
# build loses the macOS keychain silently. Linux's backends are pure Go.
version: 2

project_name: amctl

before:
  hooks:
    # goreleaser cannot glob above its working directory, and .bin/ is gitignored.
    - sh -c "mkdir -p .bin && cp ../LICENSE .bin/LICENSE"

builds:
  # Not static: the runner's deployment target is the minimum macOS supported.
  - id: darwin
    binary: amctl
    main: .
    goos: [darwin]
    goarch: [arm64, amd64]
    env:
      - CGO_ENABLED=1
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X github.com/WindKube/agent-manager/cli/internal/cmd.Version={{ .Version }}
      - -X github.com/WindKube/agent-manager/cli/internal/cmd.Commit={{ .FullCommit }}
      - -X github.com/WindKube/agent-manager/cli/internal/cmd.Date={{ .CommitDate }}

  - id: linux
    binary: amctl
    main: .
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags: *ldflags

archives:
  - ids: [darwin, linux]
    formats: [tar.gz]
    name_template: "amctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: .bin/LICENSE
        dst: LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  # The same tag may already have a release; append rather than fail.
  mode: append
  footer: |

    ### amctl {{ .Version }}

    The darwin archives are not static: they link libSystem and
    Security.framework, so that `amctl login` can use the macOS keychain. The
    linux archives are static.
