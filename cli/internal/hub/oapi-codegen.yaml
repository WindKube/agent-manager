# oapi-codegen configuration for the CLI's typed hub client.
#
# The input is the document the hub's api role EMITS
# (cli/internal/hub/openapi.json, written by
# `go run ./internal/api/cmd/openapigen` in the ROOT module), never
# specs/001-agent-manager-hub/contracts/openapi.yaml. The frozen contract is the
# machine-facing subset; the emitted document is a superset and is what the hub
# actually serves. Constitution principle V.
#
# PATHS ARE RELATIVE TO THE REPO ROOT, not to this file. oapi-codegen resolves
# `output` against its working directory, and the generator half must run in the
# root module (the hub owns `openapigen` and the `oapi-codegen` tool directive),
# so `task cli:gen:client` runs both halves from the repo root.
package: hub
output: cli/internal/hub/client.gen.go

generate:
  models: true
  client: true

output-options:
  # The seven operations the CLI uses, listed BY ID rather than by tag. The
  # emitted document declares eleven; the other four are the package registry
  # (listPackages, registerPackage, previewPackage, getPackage) and the CLI has
  # no use for them — generating them puts dead code, dead types and a
  # multipart body helper in every amctl binary.
  #
  # Listing ids explicitly, rather than excluding the registry or filtering by
  # tag, is the point: adding an operation to the hub cannot silently widen the
  # CLI's surface, and a RENAMED operation id fails the build here instead of
  # disappearing from the client. Tag filtering would not do that — the
  # `profiles` tag already spans listProfiles, getRevision and reportSync, and a
  # new profiles operation would be pulled in unasked.
  #
  # skip-prune is deliberately NOT set (the hub's own apiclient config sets it).
  # Pruning is what actually removes the registry's component schemas once their
  # operations are filtered out; with it on, the types would survive the filter
  # and the narrowing would only be cosmetic.
  include-operation-ids:
    - deviceAuthorize
    - deviceToken
    - getBundle
    - getRevision
    - health
    - listProfiles
    - reportSync

# TWO THINGS ABOUT THE GENERATED CLIENT THAT ARE EASY TO GET WRONG.
#
# `bearerFormat` is `opaque`, not `JWT`. The hub's tokens are base64url of 32
# random bytes — one segment, no header, no claims. Nothing may call jwt.Parse on
# one or read an expiry out of it; a token's lifetime is the `expires_in`
# returned beside it.
#
# The form-encoded body on /v1/device/token IS generated: oapi-codegen v2.8.0
# emits DeviceTokenWithFormdataBody, and runtime.MarshalForm falls back to the
# json tag when a $ref'd schema carries no `form` tag (runtime/bindform.go
# formFieldTag), so grant_type/device_code/client_id encode correctly. Measured,
# not assumed. No hand-written call is needed for it — do not add one.
