# One command, under five minutes, no cloud account (SC-001).
#
# This file holds the roles this project builds. Everything it depends on and
# does not build — Postgres, MinIO, the identity provider, the migrations — is in
# compose.infra.yaml, pulled in below through Compose's top-level `include:`, so
# `docker compose up` with no arguments and no -f still brings up the whole
# system. `docker compose -f compose.infra.yaml up -d` brings up only the
# dependencies, which is how you restart a role without cycling the database.
#
# The env blocks below ARE the credential boundary (constitution principle II).
# Read them as a table: `web` has no DATABASE_URL and no BLOB_URL, `api` holds a
# read-only object-store key, and only `fetcher` holds one that can write. None
# of that is an oversight to tidy up — internal/config has no field for what a
# role must not read, so adding a line here would not even compile.
name: agent-manager

include:
  - compose.infra.yaml

# The anchors below are consumed only by the services in this file, and they have
# to be declared here: an alias does not resolve across an `include:` boundary
# (research R4). compose.infra.yaml's one application-image service therefore
# writes its values out literally rather than importing these — see the note on
# `migrate-queue` there.
x-observability: &observability
  AGENT_MANAGER_LOG_LEVEL: info
  AGENT_MANAGER_LOG_FORMAT: console

x-queue-url: &queue-url
  AGENT_MANAGER_RIVER_DATABASE_URL: >-
    postgres://am_queue:local-development-am-queue@postgres:5432/river?sslmode=disable

# The URL split is INVERTED from the Keycloak arrangement this replaces, and the
# reason is a measured difference between the two providers (003 research R2).
#
# Keycloak published a browser-reachable `issuer` and derived token and JWKS from
# each request's Host header (KC_HOSTNAME_BACKCHANNEL_DYNAMIC), so the issuer was
# `localhost` and a second container-facing DISCOVERY_URL existed to fetch the
# document from a host this process could actually reach. Dex ignores the request
# Host entirely: one discovery document, byte-identical from the host and from
# the compose network. A `localhost` issuer would therefore hand api and web a
# token_endpoint and a jwks_uri naming a host no container can reach.
#
# So the issuer is now the CONTAINER-reachable URL, used verbatim for discovery,
# token and JWKS — which is why DISCOVERY_URL is gone from here, and why the
# local stack no longer asks go-oidc to skip its issuer check. The browser gets
# one override, on the single endpoint whose only job is to be clicked.
#
# `groups` is requested now, and was not before. The Keycloak realm attached the
# group-membership mapper to the client, so the claim arrived whether or not the
# scope was asked for; Dex only emits it for a client that requests the scope.
# This is also what the code's own default has always wanted (FR-107): the local
# stack stops being the odd one out.
x-oidc: &oidc
  AGENT_MANAGER_OIDC_ISSUER: http://dex:5556/dex
  AGENT_MANAGER_OIDC_BROWSER_BASE_URL: http://localhost:5556/dex
  AGENT_MANAGER_OIDC_CLIENT_ID: agent-manager
  AGENT_MANAGER_OIDC_CLIENT_SECRET: local-only-oidc-client-secret
  AGENT_MANAGER_OIDC_SCOPES: openid profile email groups

# The session mint's shared secret (contracts/auth.md). It authenticates ONE
# operation, POST /v1/sessions, whose caller is a role rather than a person: web
# owns the browser's origin and therefore the cookie, and holds no datastore
# credential, so the session row is opened by the api on its behalf.
#
# An anchor consumed by exactly two services, and that count is the property.
# Both roles must read the same value or every sign-in fails at the mint with both
# roles looking correctly configured; any THIRD service holding it is a third
# process that can ask the api to open a session for any identity it can produce a
# token for. internal/cli/compose_test.go asserts the two.
x-session-mint: &session-mint
  AGENT_MANAGER_SESSION_MINT_SECRET: local-only-session-mint-secret

x-blob-read: &blob-read
  AGENT_MANAGER_BLOB_URL: >-
    s3://agent-manager-local?region=us-east-1&endpoint=http://minio:9000&hostname_immutable=true
  AWS_ACCESS_KEY_ID: am-reader
  AWS_SECRET_ACCESS_KEY: local-development-minio-reader
  AWS_REGION: us-east-1

x-blob-write: &blob-write
  AGENT_MANAGER_BLOB_URL: >-
    s3://agent-manager-local?region=us-east-1&endpoint=http://minio:9000&hostname_immutable=true
  AWS_ACCESS_KEY_ID: am-fetcher
  AWS_SECRET_ACCESS_KEY: local-development-minio-writer
  AWS_REGION: us-east-1

x-app-image: &app-image
  image: agent-manager:local
  build:
    context: .
    args:
      VERSION: local
      COMMIT: compose

services:
  # ---------------------------------------------------------------------------
  # Serving roles.
  # ---------------------------------------------------------------------------
  api:
    <<: *app-image
    depends_on:
      migrate-queue:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      dex:
        condition: service_healthy
    environment:
      <<: [*observability, *queue-url, *oidc, *blob-read, *session-mint]
      AGENT_MANAGER_API_ADDR: ":8081"
      AGENT_MANAGER_DATABASE_URL: >-
        postgres://am_api:local-development-am-api@postgres:5432/agent_manager?sslmode=disable
      AGENT_MANAGER_PUBLIC_BASE_URL: http://localhost:8082
      AGENT_MANAGER_DEVICE_VERIFICATION_URL: http://localhost:8080/cli
      AGENT_MANAGER_OIDC_REDIRECT_URL: http://localhost:8080/auth/callback
    # 8082 on the host, 8081 in the container. 8081 is a popular port on a
    # developer's machine and losing the whole stack to something already bound
    # there is not worth the symmetry. PUBLIC_BASE_URL above must name the HOST
    # port: it is what the emitted OpenAPI document advertises as this hub's
    # server. DEVICE_VERIFICATION_URL is the web role's /cli screen, where a
    # person actually types the device code in.
    ports:
      - "8082:8081"
    restart: unless-stopped

  web:
    <<: *app-image
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: [*observability, *oidc, *session-mint]
      AGENT_MANAGER_WEB_ADDR: ":8080"
      AGENT_MANAGER_API_BASE_URL: http://api:8081
      AGENT_MANAGER_OIDC_REDIRECT_URL: http://localhost:8080/auth/callback
      # The origin a BROWSER reaches this role at, read for exactly one decision:
      # whether the two session cookies are marked Secure. http here, so they are
      # not — mark them Secure over http and the browser drops them, which
      # presents as a sign-in that completes and lands back on the sign-in screen.
      AGENT_MANAGER_PUBLIC_BASE_URL: http://localhost:8080
      # The api's own host-reachable address, for the command the
      # Connect-the-CLI screen prints. Must match api's PUBLIC_BASE_URL above.
      AGENT_MANAGER_WEB_HUB_URL: http://localhost:8082
      # What this stack's directory is called, for the sign-in screen's one action
      # (FR-105). Nothing derives it — "dex" is the container's name.
      AGENT_MANAGER_WEB_PROVIDER_NAME: the local directory
      # FR-119, and the only place this may ever be true. It prints the seeded
      # logins on the sign-in screen, which is what makes the quickstart a
      # quickstart and would be a credential leak anywhere else.
      AGENT_MANAGER_WEB_DEV_CREDENTIAL_HINT: "true"
    command: ["serve", "web"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/agent-manager", "healthcheck", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8080:8080"
    restart: unless-stopped

  fetcher:
    <<: *app-image
    depends_on:
      migrate-queue:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: [*observability, *queue-url, *blob-write]
      AGENT_MANAGER_DATABASE_URL: >-
        postgres://am_fetcher:local-development-am-fetcher@postgres:5432/agent_manager?sslmode=disable
    command: ["worker", "run", "fetcher"]
    # A worker has no HTTP listener yet, so the image's HEALTHCHECK — which probes
    # the api's port — would mark it unhealthy forever. T109 adds the metrics and
    # liveness listener on AGENT_MANAGER_METRICS_ADDR; the probe comes back then.
    healthcheck:
      disable: true
    restart: unless-stopped

  scanner:
    <<: *app-image
    depends_on:
      migrate-queue:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: [*observability, *queue-url, *blob-read]
      AGENT_MANAGER_DATABASE_URL: >-
        postgres://am_scanner:local-development-am-scanner@postgres:5432/agent_manager?sslmode=disable
      AGENT_MANAGER_RULEPACK_DIR: /etc/agent-manager/rulepack
    # Detection rules are DATA (constitution, Development Workflow): adding or
    # tuning one must not require a code change or a rebuild. The mount is what
    # makes that true of this stack rather than of the design document — edit a
    # file under internal/worker/scanner/rulepack and restart this one container.
    #
    # The image embeds the same pack, so a deployment that mounts nothing still
    # scans; a scanner with no rules would report every check passing and every
    # bundle clean, which is the worst answer this system can give. Read-only,
    # because nothing in the scanner writes rules.
    volumes:
      - ./internal/worker/scanner/rulepack:/etc/agent-manager/rulepack:ro
    command: ["worker", "run", "scanner"]
    # A worker has no HTTP listener yet, so the image's HEALTHCHECK — which probes
    # the api's port — would mark it unhealthy forever. T109 adds the metrics and
    # liveness listener on AGENT_MANAGER_METRICS_ADDR; the probe comes back then.
    healthcheck:
      disable: true
    restart: unless-stopped

  # seed writes bundle bytes as well as rows, so it holds the writer key. It is a
  # one-shot: it must exit 0, and `docker compose up` stays up without it.
  seed:
    <<: *app-image
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: [*observability, *blob-write]
      AGENT_MANAGER_DATABASE_URL: >-
        postgres://am_api:local-development-am-api@postgres:5432/agent_manager?sslmode=disable
    command: ["seed"]
    healthcheck:
      disable: true
    restart: "no"

  # ---------------------------------------------------------------------------
  # Optional. `docker compose --profile queue-ui up`
  #
  # On 8085 because the api took 8082 on the host, which is where this used to be.
  # ---------------------------------------------------------------------------
  queue-ui:
    image: ghcr.io/riverqueue/riverui:0.19.0
    profiles: ["queue-ui"]
    depends_on:
      migrate-queue:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: >-
        postgres://am_queue:local-development-am-queue@postgres:5432/river?sslmode=disable
      RIVER_HOST: ":8085"
    ports:
      - "8085:8085"
