{{- range $role := list "api" "web" "fetcher" "scanner" "notifier" "migrate" }}
{{- $cfg := index $.Values $role }}
{{- if not $cfg.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "am.fullname" $ }}-{{ $role }}
  labels:
    {{- include "am.labels" (dict "root" $ "role" $role) | nindent 4 }}
  {{- if eq $role "migrate" }}
  # The migration hook runs before ordinary resources exist, so its Secret is a
  # hook too, created just ahead of it.
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
type: Opaque
stringData:
  {{- range $name, $value := $cfg.secretEnv }}
  {{- if $value }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
