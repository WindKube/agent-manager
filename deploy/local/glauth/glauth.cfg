# The local directory: two people in two groups, plus the account Dex binds as.
#
# Laptop credentials, documented in the quickstart. Nothing here is a secret and
# nothing here is reachable off the compose network.
#
# THE TWO GROUP NAMES AND THE TWO USERS ARE A SHARED CONSTANT with
# internal/seed/groups.go (seed.GroupEngPlatform, seed.GroupEngSecurity,
# seed.DirectoryUsers). A mismatch fails nowhere: discovery answers, the password
# is accepted, the token carries a `groups` claim, and the seed's
# `group_name = any (i.groups)` matches nothing, so the user lands on a working
# page with no role and no error.
# TestTheGlauthFixtureSpellsTheGroupNamesTheSeedMapsToRoles in
# internal/auth/localidp_fixture_test.go parses this file and compares, so
# editing one side alone goes red.

[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=example,dc=dev"
  # These two decide the shape of every DN glauth serves, and with it two things
  # in deploy/local/dex/config.yaml. Served user DNs are
  # cn=<name>,ou=<primarygroup>,ou=users,<baseDN> — glauth interposes `ou=users`,
  # and that is the DN `userAttr: DN` feeds into Dex's group search. The bind
  # handler is looser than the search: both cn=serviceuser,ou=svcaccts,<baseDN>
  # and the same DN with `ou=users` in it authenticate, measured 2026-08-31, so
  # do not "correct" Dex's bindDN in either direction expecting a change.
  # groupformat is also why a group entry's name attribute is `ou` and has no
  # `cn` at all — trap 3 in contracts/local-identity.md.
  nameformat = "cn"
  groupformat = "ou"

# Dex's bind account. It needs search and nothing else, and it deliberately
# carries no `mail`: Dex's user search is `username: mail`, so an account without
# one can never authenticate a person and can never collide with a seeded
# identity row.
[[users]]
  name = "serviceuser"
  uidnumber = 5003
  primarygroup = 5502
  # sha256("local-only-dex-bind-password")
  passsha256 = "103d9ecf15c9eca62a8fae3a64129bb76beb64fd59fff71a467a658670a3b809"
    [[users.capabilities]]
    action = "search"
    object = "*"

# seed.DirectoryUserPlatform / seed.DirectoryEmailPlatform -> catalog admin.
[[users]]
  name = "kwiatrzyk"
  mail = "kwiatrzyk@example.com"
  uidnumber = 5001
  primarygroup = 5501
  # sha256("local-only-directory-password")
  passsha256 = "2950e21055d15398707210d8c7a1d78e0f0b3779ae133a665dd683b55476548d"

# seed.DirectoryUserSecurity / seed.DirectoryEmailSecurity -> scanner reviewer.
[[users]]
  name = "anowak"
  mail = "anowak@example.com"
  uidnumber = 5002
  primarygroup = 5500
  # sha256("local-only-directory-password")
  passsha256 = "2950e21055d15398707210d8c7a1d78e0f0b3779ae133a665dd683b55476548d"

# seed.GroupEngPlatform
[[groups]]
  name = "eng-platform"
  gidnumber = 5501

# seed.GroupEngSecurity
[[groups]]
  name = "eng-security"
  gidnumber = 5500

[[groups]]
  name = "svcaccts"
  gidnumber = 5502
