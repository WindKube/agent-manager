# The local directory: three people, plus the account Dex binds as.
#
# Laptop credentials, documented in the quickstart. Nothing here is a secret and
# nothing here is reachable off the compose network.
#
# THE GROUP NAMES AND THE USERS ARE A SHARED CONSTANT with
# internal/seed/groups.go (seed.GroupEngPlatform, seed.GroupEngSecurity,
# seed.DirectoryUsers). A mismatch fails nowhere: discovery answers, the password
# is accepted, the token carries a `groups` claim, and the seed's
# `group_name = any (i.groups)` matches nothing, so the user lands on a working
# page with no role and no error.
# TestTheGlauthFixtureSpellsTheGroupNamesTheSeedMapsToRoles in
# internal/auth/localidp_fixture_test.go parses this file and compares, so
# editing one side alone goes red.
#
# Each person has one primarygroup, and the two who resolve a role are ALSO in
# seed.GroupEngAll through `othergroups`. That secondary membership is what makes
# a profile shared WITH A GROUP reachable by signing in: the seed shares SRE
# On-call with eng-all as consumer, and without this both directory users would
# be outside every group membership the dataset writes, so the whole group half
# of the sharing panel would exist only in tests.
#
# glauth serves `othergroups` in the same `uniqueMember` attribute Dex's group
# search reads, so both memberships arrive in one `groups` claim — measured
# through the real containers on 2026-08-31: kwiatrzyk gets
# [eng-platform eng-all] and anowak gets [eng-security eng-all]. It is not
# obvious that it would; a directory that answered a group search with primary
# memberships only would have made this silently do nothing.

[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=example,dc=dev"
  # These two decide the shape of every DN glauth serves, and with it two things
  # in deploy/local/dex/config.yaml. Served user DNs are
  # cn=<name>,ou=<primarygroup>,ou=users,<baseDN> — glauth interposes `ou=users`,
  # and that is the DN `userAttr: DN` feeds into Dex's group search. The bind
  # handler is looser than the search: both cn=serviceuser,ou=svcaccts,<baseDN>
  # and the same DN with `ou=users` in it authenticate, measured 2026-08-31, so
  # do not "correct" Dex's bindDN in either direction expecting a change.
  # groupformat is also why a group entry's name attribute is `ou` and has no
  # `cn` at all — trap 3 in contracts/local-identity.md.
  nameformat = "cn"
  groupformat = "ou"

# Dex's bind account. It needs search and nothing else, and it deliberately
# carries no `mail`: Dex's user search is `username: mail`, so an account without
# one can never authenticate a person and can never collide with a seeded
# identity row.
[[users]]
  name = "serviceuser"
  uidnumber = 5003
  primarygroup = 5502
  # sha256("local-only-dex-bind-password")
  passsha256 = "103d9ecf15c9eca62a8fae3a64129bb76beb64fd59fff71a467a658670a3b809"
    [[users.capabilities]]
    action = "search"
    object = "*"

# seed.DirectoryUserPlatform / seed.DirectoryEmailPlatform -> catalog admin.
#
# eng-all maps to profile-consumer, which is LOWER than catalog-admin, and
# auth.HighestRole takes the most privileged of a person's mapped groups — so the
# secondary membership adds a group without changing the role. That is asserted
# rather than assumed: TestTheSharedDirectoryGroupDoesNotChangeEitherUsersRole.
[[users]]
  name = "kwiatrzyk"
  mail = "kwiatrzyk@example.com"
  uidnumber = 5001
  primarygroup = 5501
  othergroups = [5504]
  # sha256("local-only-directory-password")
  passsha256 = "2950e21055d15398707210d8c7a1d78e0f0b3779ae133a665dd683b55476548d"

# seed.DirectoryUserSecurity / seed.DirectoryEmailSecurity -> scanner reviewer.
[[users]]
  name = "anowak"
  mail = "anowak@example.com"
  uidnumber = 5002
  primarygroup = 5500
  othergroups = [5504]
  # sha256("local-only-directory-password")
  passsha256 = "2950e21055d15398707210d8c7a1d78e0f0b3779ae133a665dd683b55476548d"

# seed.DirectoryUserUnmapped / seed.DirectoryEmailUnmapped -> NO ROLE.
#
# NO `othergroups`. eng-all resolves to profile-consumer, so putting this account
# in it would give them a role and delete the only route to FR-117's screen — the
# same one-line mistake the paragraph below warns about, wearing a different hat.
#
# In seed.GroupUnmapped, which internal/seed/groups.go deliberately maps to
# nothing. This is the account that makes FR-117's screen — signed in, holding no
# role — reachable in a browser instead of only in a component test. Do not add
# their group to seed.GroupRoles to "fix" them; that deletes the only route to a
# whole screen.
[[users]]
  name = "dnowicki"
  mail = "dnowicki@example.com"
  uidnumber = 5004
  primarygroup = 5503
  # sha256("local-only-directory-password")
  passsha256 = "2950e21055d15398707210d8c7a1d78e0f0b3779ae133a665dd683b55476548d"

# seed.GroupEngPlatform
[[groups]]
  name = "eng-platform"
  gidnumber = 5501

# seed.GroupEngSecurity
[[groups]]
  name = "eng-security"
  gidnumber = 5500

# seed.GroupUnmapped. A group the directory has and the hub does not map.
[[groups]]
  name = "vendors"
  gidnumber = 5503

[[groups]]
  name = "svcaccts"
  gidnumber = 5502

# seed.GroupEngAll. Nobody's PRIMARY group: it exists to be a second membership,
# which is the only way this directory can demonstrate a person holding two
# groups at once and a profile shared with one of them.
[[groups]]
  name = "eng-all"
  gidnumber = 5504
