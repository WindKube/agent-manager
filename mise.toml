# The dev toolchain. `mise install` gets you everything the Taskfile and the
# pre-commit hooks expect on PATH.
#
# Not in here: atlas and tailwindcss. Those are downloaded into .bin/ by the
# Taskfile because their versions are coupled to checked-in artefacts —
# atlas.sum and the generated CSS — rather than to a developer's environment.
[tools]
go = "1.26.5"
golangci-lint = "2.12.2"
task = "3"
pre-commit = "4"

# Both also run in CI (.github/workflows/security.yaml). Pinned so a local run and
# a CI run agree on what a finding is.
zizmor = "1.29.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
