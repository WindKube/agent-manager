openapi: 3.1.0

# ---------------------------------------------------------------------------
# SCOPE NOTE — read before editing.
#
# Constitution principle V: the served OpenAPI document is EMITTED from the huma
# operation definitions in internal/api. This file is not that document and must never
# be hand-maintained into a copy of it.
#
# What this file is: the FROZEN MACHINE-FACING SURFACE. These operations are consumed by
# the CLI (spec User Story 6), which ships separately and cannot be redeployed in step
# with the hub. They are specified here, before implementation, so the contract is fixed
# and the "Connect the CLI" screen is truthful about a real API rather than a mockup.
#
# The web-facing operations are inventoried at the bottom for completeness. Their schemas
# come from the generated document; do not duplicate them here.
#
# CI check: the generated document MUST remain a superset of this file, and no operation
# named here may change shape without a version bump. That test is the point of the file.
# ---------------------------------------------------------------------------
#
# Every credential-shaped example below is a prose placeholder, never a token-shaped
# string. gitleaks scans this tree and a realistic-looking `access_token` example is
# indistinguishable to it from a leaked one.

info:
  title: Agent Manager — machine-facing API
  version: 1.0.0
  description: |
    The subset of the Agent Manager API consumed by machine clients. Authentication is the
    OAuth 2.0 device authorisation grant (RFC 8628) against the organisation's identity
    provider, brokered by the hub.
  contact:
    name: Agent Manager maintainers
    url: https://github.com/WindKube/agent-manager
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: https://hub.example.dev
    description: The organisation's hub

security:
  - bearerAuth: []

tags:
  - name: bundles
    description: Immutable version content.
  - name: device
    description: RFC 8628 device authorisation. Unauthenticated by definition.
  - name: profiles
    description: What this identity may read, and how it resolves.
  - name: system
    description: Probes a supervisor calls. Unauthenticated.

paths:

  /v1/device/authorize:
    post:
      tags: [device]
      summary: Begin device authorisation
      operationId: deviceAuthorize
      security: []
      description: |
        Opens an RFC 8628 device authorisation. Returns a user code for the human to type on
        the hub's verification page and a device code for the client to poll with. Nothing is
        authorised until a human approves that user code, so the response is not a credential
        grant — it is a pending request.
      requestBody:
        required: true
        description: The client asking for authorisation, and the machine the grant is bound to.
        content:
          application/json:
            schema:
              type: object
              required: [client_id, host]
              properties:
                client_id:
                  type: string
                  description: The CLI's registered OAuth client identifier.
                  examples: [agent-manager-cli]
                host:
                  type: string
                  description: |
                    Hostname of the requesting machine. Bound to the authorisation and
                    displayed to the approving human (FR-041), so approval is an informed act.
                  examples: [dev-laptop-01]
                scope:
                  type: string
                  description: Space-delimited scopes. Omitted means the client's default scope.
                  examples: ["profiles:read bundles:read"]
      responses:
        "200":
          description: Authorisation pending
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, expires_in, interval]
                properties:
                  device_code:
                    type: string
                    description: Bearer credential. Stored hashed server-side; never logged.
                    examples: [example-device-code-not-a-real-credential]
                  user_code:
                    type: string
                    pattern: "^[0-9A-HJ-NP-TV-Z]{4}-[0-9A-HJ-NP-TV-Z]{4}$"
                    description: Crockford base32, ambiguous glyphs excluded. Shape "HKQ2-9FTL".
                    examples: [HKQ2-9FTL]
                  verification_uri:
                    type: string
                    format: uri
                    description: The page the human opens to type the user code in.
                    examples: ["https://hub.example.dev/device"]
                  verification_uri_complete:
                    type: string
                    format: uri
                    description: The same page with the code pre-filled, for a QR code or a click.
                    examples: ["https://hub.example.dev/device?user_code=HKQ2-9FTL"]
                  expires_in:
                    type: integer
                    description: Seconds until the device code expires and polling must stop.
                    examples: [900]
                  interval:
                    type: integer
                    description: Minimum seconds between polls of /v1/device/token.
                    examples: [5]
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/device/token:
    post:
      tags: [device]
      summary: Poll for the issued token
      operationId: deviceToken
      security: []
      description: |
        Standard RFC 8628 polling. A code that has expired, been consumed, or been approved
        by an identity other than the requester is refused and no token is issued (FR-042).
      requestBody:
        required: true
        description: The RFC 8628 token request, form-encoded as the RFC requires.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, device_code, client_id]
              properties:
                grant_type:
                  type: string
                  const: urn:ietf:params:oauth:grant-type:device_code
                  description: Fixed by RFC 8628 §3.4. No other grant type is accepted here.
                  examples: [urn:ietf:params:oauth:grant-type:device_code]
                device_code:
                  type: string
                  description: The `device_code` handed back by /v1/device/authorize.
                  examples: [example-device-code-not-a-real-credential]
                client_id:
                  type: string
                  description: Must be the same client_id that opened the authorisation.
                  examples: [agent-manager-cli]
      responses:
        "200":
          description: Approved; short-lived token issued (FR-043)
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                    description: Bearer token for every other operation here. Never logged.
                    examples: [example-access-token-not-a-real-credential]
                  token_type:
                    type: string
                    const: Bearer
                    description: Always `Bearer`.
                    examples: [Bearer]
                  expires_in:
                    type: integer
                    description: Seconds until the access token expires.
                    examples: [3600]
                  refresh_token:
                    type: string
                    description: |
                      Present only when the client may refresh without a second human approval.
                    examples: [example-refresh-token-not-a-real-credential]
        "400":
          description: RFC 8628 error
          content:
            application/json:
              schema:
                type: object
                description: The RFC 8628 error envelope.
                properties:
                  error:
                    type: string
                    enum: [authorization_pending, slow_down, access_denied, expired_token, invalid_grant]
                    description: |
                      `authorization_pending` means keep polling at the advertised interval;
                      `slow_down` means back off and widen it. The rest are final — stop.
                    examples: [authorization_pending]

  /v1/profiles:
    get:
      tags: [profiles]
      summary: Profiles readable by this identity
      operationId: listProfiles
      description: |
        Returns exactly the profiles this identity may read via direct membership or group
        mapping, and no others (FR-044). Not a filtered view of a larger list — unreadable
        profiles are not enumerated at all.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    description: Readable profiles. Order is not part of the contract.
                    examples:
                      - - slug: platform-baseline
                          name: Platform baseline
                          visibility: organisation
                          packageCount: 12
                          headRevision: 7
                    items:
                      type: object
                      required: [slug, name, packageCount, headRevision]
                      properties:
                        slug:
                          type: string
                          description: URL-safe identifier, unique within the organisation.
                          examples: [platform-baseline]
                        name:
                          type: string
                          description: Human-readable name as shown in the web UI.
                          examples: [Platform baseline]
                        visibility:
                          type: string
                          enum: [organisation, shared, private]
                          description: How this profile came to be readable by this identity.
                          examples: [organisation]
                        packageCount:
                          type: integer
                          description: Packages in the head revision, excluding skipped entries.
                          examples: [12]
                        headRevision:
                          type: integer
                          description: The most recent published revision number.
                          examples: [7]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/profiles/{slug}/revisions/{revision}:
    get:
      tags: [profiles]
      summary: Fetch a resolved revision lockfile
      operationId: getRevision
      description: |
        `revision` accepts `head` or an integer. The response body conforms to
        lockfile.schema.json, including the `skipped` array — a gate-excluded package is
        reported with its reason, never silently omitted (FR-036).
      parameters:
        - name: slug
          in: path
          required: true
          description: The profile's URL-safe identifier.
          schema: { type: string }
        - name: revision
          in: path
          required: true
          description: "`head` for the latest published revision, or an exact revision number."
          schema: { type: string, pattern: "^(head|[0-9]+)$" }
      responses:
        "200":
          description: The immutable resolved lockfile
          content:
            application/json:
              # Located relatively; the schema's own $id keeps the canonical URL. The
              # absolute $id is a name, not an address — it does not resolve over HTTP.
              schema:
                $ref: "./lockfile.schema.json"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such profile or revision, or not readable by this identity.

  /v1/bundles/{publisher}/{name}/{version}:
    get:
      tags: [bundles]
      summary: Download an immutable version bundle
      operationId: getBundle
      description: |
        Returns the `bundle.tar.zst` bytes, or a 307 to a pre-signed object-store URL. The
        `Digest` header carries the sha256 the client MUST verify before writing anything to
        disk. A rejected version is never served regardless of gate (FR-029).
      parameters:
        - name: publisher
          in: path
          required: true
          description: The publishing namespace, as it appears in the catalog.
          schema: { type: string }
        - name: name
          in: path
          required: true
          description: The package name within that publisher.
          schema: { type: string }
        - name: version
          in: path
          required: true
          description: An exact version. Ranges and `latest` are resolved before this call.
          schema: { type: string }
      responses:
        "200":
          description: Bundle bytes
          headers:
            Digest:
              description: RFC 3230 digest of the body. Verify before writing to disk.
              schema: { type: string, pattern: "^sha-256=[A-Za-z0-9+/=]+$" }
            ETag:
              description: The immutable version's entity tag. Safe to cache forever.
              schema: { type: string }
          content:
            application/zstd:
              schema: { type: string, format: binary }
        "307":
          description: Redirect to a short-lived pre-signed object-store URL.
        "403":
          description: Version rejected or not distributable under the current gate.
        "404": { description: No such version. }

  /v1/sync:
    post:
      tags: [profiles]
      summary: Report a completed sync
      operationId: reportSync
      description: |
        Writes one sync_event and one audit row of kind `sync` (FR-050, R8). One call per
        sync, not per package — install counts are aggregated server-side from the
        revision's contents.
      requestBody:
        required: true
        description: What was synced, where, and what the client chose not to write.
        content:
          application/json:
            schema:
              type: object
              required: [profile, revision, host, targets]
              properties:
                profile:
                  type: string
                  description: Slug of the profile that was synced.
                  examples: [platform-baseline]
                revision:
                  type: integer
                  description: The exact revision the client resolved against.
                  examples: [7]
                host:
                  type: string
                  description: Hostname the sync landed on, for the audit row.
                  examples: [dev-laptop-01]
                targets:
                  type: array
                  description: Agent directories the client actually wrote.
                  examples: [[claude-code]]
                  items: { type: string, enum: [claude-code, codex] }
                skipped:
                  type: array
                  description: Entry ids the client skipped locally, if any.
                  examples: [[acme/legacy-helper]]
                  items: { type: string }
      responses:
        "204": { description: Recorded. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/health:
    get:
      tags: [system]
      summary: Liveness and readiness
      operationId: health
      security: []
      description: |
        Liveness and readiness in one probe: 200 when every dependency this role needs is
        reachable, 503 otherwise. Has no authenticated variant and no client error case.
      responses:
        "200": { description: Serving. }
        "503": { description: Not ready — a dependency is unreachable. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      # `opaque`, not `JWT`. This said JWT until the device flow was implemented and
      # the claim became reachable: `internal/auth.NewToken` returns
      # base64.RawURLEncoding of 32 crypto/rand bytes — one segment, no header, no
      # payload, no claims. `bearerFormat` is free-form in OpenAPI 3.1 and exists
      # only as a hint to a client author, so a wrong hint is worse than none: a CLI
      # that believed it would write `jwt.Parse` and fail on the first token this
      # hub ever issues. Corrected here rather than worked around because no client
      # has shipped against it.
      bearerFormat: opaque
      description: |
        The `access_token` issued by /v1/device/token, sent as `Authorization: Bearer <token>`.
        The token is opaque: do not decode it, and do not read an expiry out of it. A
        token's lifetime is the `expires_in` returned beside it.
  responses:
    Unauthorized:
      description: Missing, expired or invalid token.
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }

# ---------------------------------------------------------------------------
# WEB-FACING OPERATIONS — inventory only. Schemas come from the generated document.
#
#  Catalog     GET    /v1/packages                 list + search + facets (US2)
#              GET    /v1/packages/facets          counts per category and tag (R4)
#              GET    /v1/packages/{id}            detail (US3)
#              POST   /v1/packages                 register from URL or upload (US1)
#              POST   /v1/packages/preview         pre-submit archive entry validation
#  Scanner     GET    /v1/findings                 open findings + stats (US4)
#              GET    /v1/findings/{id}            detail incl. checks-run matrix
#              POST   /v1/findings/{id}/approve    override with note and expiry
#              POST   /v1/findings/{id}/reject     quarantine permanently
#  Profiles    GET    /v1/profiles/{slug}          detail with entries and resolution (US5)
#              PUT    /v1/profiles/{slug}/entries  pin / unpin / reorder
#              POST   /v1/profiles/{slug}/revisions publish
#              PUT    /v1/profiles/{slug}/members  sharing
#              PUT    /v1/profiles/{slug}/targets  sync targets
#  Org         GET    /v1/org/policy               (US7)
#              PUT    /v1/org/policy
#              GET    /v1/org/categories
#              PUT    /v1/org/group-roles
#  Storage     GET    /v1/storage                  stats, key layout, bucket settings (US8)
#  Audit       GET    /v1/audit                    paged log
#              GET    /v1/audit.csv                full export of the current scope
# ---------------------------------------------------------------------------
